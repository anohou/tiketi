; ╔══════════════════════════════════════════════════════════════════════════════╗
; ║  PHP production overrides — deployment kit                                  ║
; ╚══════════════════════════════════════════════════════════════════════════════╝

[PHP]
; ── Security ──────────────────────────────────────────────────────────────────
expose_php             = Off
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Execution limits ──────────────────────────────────────────────────────────
max_execution_time     = 120
max_input_time         = 60
memory_limit           = 512M

; ── Upload limits (Product & Filament media) ──────────────────────────────────
upload_max_filesize    = 32M
post_max_size          = 128M
max_file_uploads       = 10

; ── Session ───────────────────────────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
; Defense in depth for CVE-2026-109618/CVE-2026-109619. The PHP upgrade is
; still mandatory; this disables an unused request-processing feature.
session.upload_progress.enabled = 0

; ── Timezone ─────────────────────────────────────────────────────────────────
date.timezone = UTC

; ── OPcache ──────────────────────────────────────────────────────────────────
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 128
opcache.interned_strings_buffer= 16
opcache.max_accelerated_files  = 10000
opcache.revalidate_freq        = 0
opcache.validate_timestamps    = 0
opcache.save_comments          = 1
opcache.fast_shutdown          = 1
