name: Promote Verified Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      image_ref:
        description: Optional immutable digest; blank selects the latest successful main build
        required: false
        type: string

concurrency:
  group: promote-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.event.inputs.environment }}
  PROMOTION_TYPE: https://anohou.dev/attestations/promotion/v1

jobs:
  promote:
    name: Promote immutable digest
    runs-on: ubuntu-latest
    env:
      REQUESTED_IMAGE_REF: ${{ inputs.image_ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    environment: ${{ github.event.inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and validate promotion input
        id: promotion
        run: |
          set -euo pipefail
          image_name="$(
            awk '
              $1 == "registry:" { section="registry"; next }
              $1 == "app:" { section="app"; next }
              /^[^[:space:]][^:]*:/ { section=""; next }
              section == "registry" && $1 == "image:" { sub(/^[^:]+:[[:space:]]*/, ""); gsub(/^"|"$/, ""); print; found=1; exit }
              section == "app" && $1 == "image:" { app_image=$0; sub(/^[^:]+:[[:space:]]*/, "", app_image); gsub(/^"|"$/, "", app_image) }
              END { if (!found && app_image != "") print app_image }
            ' deployment/environments/${{ env.DEPLOY_ENV }}/config/config.yml
          )"
          [[ -n "${image_name}" ]] || { echo "Unable to resolve configured image" >&2; exit 1; }

          image_ref="${REQUESTED_IMAGE_REF}"
          if [[ -z "${image_ref}" ]]; then
            build_sha="$(
              gh api \
                "repos/${{ github.repository }}/actions/workflows/build-and-push.yml/runs?status=success&branch=${DEFAULT_BRANCH}&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty'
            )"
            [[ "${build_sha}" =~ ^[a-f0-9]{40}$ ]] || {
              echo "Unable to find a successful build-and-push run on ${DEFAULT_BRANCH}" >&2
              exit 1
            }
            image_ref="${image_name}:${build_sha}"
            resolved_digest="$(docker buildx imagetools inspect "${image_ref}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
            [[ "${resolved_digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Unable to resolve immutable digest for ${image_ref}" >&2
              exit 1
            }
            image_ref="${image_name}@${resolved_digest}"
            echo "Selected latest successful main build: ${image_name}:${build_sha}"
          fi
          [[ "${image_ref}" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_./-]+@sha256:[a-f0-9]{64}$ ]] || {
            echo "image_ref must be an immutable GHCR sha256 digest reference" >&2
            exit 1
          }
          [[ "${image_ref%@*}" == "${image_name}" ]] || {
            echo "Promotion image ${image_ref%@*} does not match configured image ${image_name}" >&2
            exit 1
          }

          case "${DEPLOY_ENV}" in
            staging|production) ;;
            *) echo "Unsupported promotion environment: ${DEPLOY_ENV}" >&2; exit 1 ;;
          esac
          digest="${image_ref#*@}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "channel=deploy-${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: v2.4.1

      - name: Verify build trust before promotion
        run: |
          set -euo pipefail
          image_ref="${{ steps.promotion.outputs.image_ref }}"
          identity="^https://github.com/${{ github.repository }}/.github/workflows/build-and-push\.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity-regexp "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null
          cosign verify-attestation --type slsaprovenance --certificate-identity-regexp "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null
          if ! cosign verify-attestation --type spdxjson --certificate-identity-regexp "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null 2>&1; then
            cosign verify-attestation --type https://spdx.dev/Document --certificate-identity-regexp "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null
          fi

      - name: Publish signed promotion attestation
        run: |
          set -euo pipefail
          predicate="$(mktemp)"
          trap 'rm -f "${predicate}"' EXIT
          jq -n \
            --arg app "Tiketi" \
            --arg environment "${DEPLOY_ENV}" \
            --arg digest "${{ steps.promotion.outputs.digest }}" \
            --arg repository "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg promoted_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{app:$app,environment:$environment,digest:$digest,repository:$repository,actor:$actor,run_url:$run_url,promoted_at:$promoted_at}' \
            > "${predicate}"
          cosign attest --yes --type "${PROMOTION_TYPE}" --predicate "${predicate}" "${{ steps.promotion.outputs.image_ref }}"

      - name: Move environment channel after verification
        run: |
          set -euo pipefail
          channel_ref="${{ steps.promotion.outputs.image_name }}:${{ steps.promotion.outputs.channel }}"
          docker buildx imagetools create --tag "${channel_ref}" "${{ steps.promotion.outputs.image_ref }}"
          resolved="$(docker buildx imagetools inspect "${channel_ref}" --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "${resolved}" == "${{ steps.promotion.outputs.digest }}" ]] || {
            echo "Channel digest verification failed: expected ${{ steps.promotion.outputs.digest }}, got ${resolved}" >&2
            exit 1
          }

      - name: Write promotion summary
        run: |
          {
            echo "## Promotion Summary"
            echo ""
            echo "- Environment: \`${DEPLOY_ENV}\`"
            echo "- Image: \`${{ steps.promotion.outputs.image_ref }}\`"
            echo "- Channel: \`${{ steps.promotion.outputs.image_name }}:${{ steps.promotion.outputs.channel }}\`"
            echo "- Server access: \`none\`"
            echo "- Promotion attestation: \`${PROMOTION_TYPE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
