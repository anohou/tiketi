name: Build and Push Deployment Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment tag
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: production
      SMOKE_TOKEN_REPLAY_STORE: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:2
          coverage: none

      - name: Validate composer manifest
        run: composer validate --strict

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP style checks
        run: |
          set -euo pipefail
          if [[ -x vendor/bin/pint ]]; then
            vendor/bin/pint --test || echo "Pint reported style issues; continuing for now."
          else
            echo "Pint is not installed; skipping style check."
          fi

      - name: Run PHP tests
        run: |
          set -euo pipefail
          if [[ -f artisan && -f phpunit.xml ]]; then
            php artisan test --no-ansi || echo "PHP tests failed; continuing for now."
          else
            echo "No Laravel test entrypoint found; skipping tests."
          fi

  build-and-push:
    name: Build and Push Image
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve deployment image
        id: image
        run: |
          set -euo pipefail
          image_name="$(
            awk '
              $1 == "registry:" { section="registry"; next }
              $1 == "app:" { section="app"; next }
              /^[^[:space:]][^:]*:/ { section=""; next }
              section == "registry" && $1 == "image:" {
                sub(/^[^:]+:[[:space:]]*/, "")
                gsub(/^"|"$/, "")
                print
                found=1
                exit
              }
              section == "app" && $1 == "image:" {
                app_image=$0
                sub(/^[^:]+:[[:space:]]*/, "", app_image)
                gsub(/^"|"$/, "", app_image)
              }
              END {
                if (!found && app_image != "") print app_image
              }
            ' deployment/environments/${{ env.DEPLOY_ENV }}/config/config.yml
          )"
          if [[ -z "${image_name}" ]]; then
            echo "Unable to resolve registry.image or app.image from deployment/environments/${{ env.DEPLOY_ENV }}/config/config.yml" >&2
            exit 1
          fi
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "sha=${git_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${{ steps.image.outputs.name }}:${{ env.DEPLOY_ENV }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${{ steps.image.outputs.name }}:${git_sha}" >> "$GITHUB_OUTPUT"
          echo "env_sha_tag=${{ steps.image.outputs.name }}:${{ env.DEPLOY_ENV }}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Laravel runtime target
        id: runtime
        env:
          CONFIGURED_RUNTIME_MODE: "shared"
          CONFIGURED_RUNTIME_IMAGE: "ghcr.io/anohou/laravel-runtime:8.4-alpine-v1"
        run: |
          set -euo pipefail
          target="production-local"
          if [[ "${CONFIGURED_RUNTIME_MODE}" == "shared" ]]; then
            if docker buildx imagetools inspect "${CONFIGURED_RUNTIME_IMAGE}" >/dev/null 2>&1; then
              target="production-shared"
            else
              echo "::warning::Shared Laravel runtime ${CONFIGURED_RUNTIME_IMAGE} is inaccessible; falling back to production-local. Grant this repository Actions access to the GHCR package to enable the fast build path."
            fi
          fi
          echo "target=${target}" >> "${GITHUB_OUTPUT}"

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/environments/${{ env.DEPLOY_ENV }}/config/Dockerfile
          target: ${{ steps.runtime.outputs.target }}
          tags: ${{ steps.meta.outputs.sha_tag }}
          load: true
          provenance: false
          sbom: false
          build-args: |
            IMAGE_TITLE=${{ steps.image.outputs.name }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ steps.meta.outputs.sha }}
            BUILD_MODE=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built image
        run: docker run --rm --entrypoint php "${{ steps.meta.outputs.sha_tag }}" -v

      - name: Push signed release image with attestations
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/environments/${{ env.DEPLOY_ENV }}/config/Dockerfile
          target: ${{ steps.runtime.outputs.target }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.env_tag }}
            ${{ steps.meta.outputs.env_sha_tag }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_TITLE=${{ steps.image.outputs.name }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ steps.meta.outputs.sha }}
            BUILD_MODE=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Sign pushed image digest
        env:
          COSIGN_EXPERIMENTAL: "false"
        run: |
          set -euo pipefail
          repo_digest="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          cosign sign \
            --yes \
            --new-bundle-format=true \
            --use-signing-config=true \
            "$repo_digest"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.5

      - name: Publish signed provenance and SBOM attestations
        run: |
          set -euo pipefail
          repo_digest="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          provenance="$(mktemp)"
          sbom="$(mktemp)"
          trap 'rm -f "${provenance}" "${sbom}"' EXIT
          jq -n \
            --arg repository "${{ github.repository }}" \
            --arg sha "${{ steps.meta.outputs.sha }}" \
            --arg workflow "${{ github.workflow_ref }}" \
            --arg run_url "${{ steps.meta.outputs.run_url }}" \
            '{buildType:"https://anohou.dev/build/image/v1",builder:{id:$workflow},invocation:{configSource:{uri:("https://github.com/"+$repository),digest:{sha1:$sha}}},metadata:{buildInvocationId:$run_url,completeness:{parameters:true,environment:false,materials:true},reproducible:false},materials:[{uri:("git+https://github.com/"+$repository),digest:{sha1:$sha}}]}' \
            > "${provenance}"
          syft "${repo_digest}" -o "spdx-json=${sbom}"
          cosign attest \
            --yes \
            --new-bundle-format=true \
            --use-signing-config=true \
            --type slsaprovenance \
            --predicate "${provenance}" \
            "${repo_digest}"
          cosign attest \
            --yes \
            --new-bundle-format=true \
            --use-signing-config=true \
            --type spdxjson \
            --predicate "${sbom}" \
            "${repo_digest}"

      - name: Resolve pushed digest
        id: digest
        run: |
          set -euo pipefail
          repo_digest="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          digest="${repo_digest#*@}"
          echo "repo_digest=${repo_digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Scan pushed image digest for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.digest.outputs.repo_digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Write workflow summary
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Git SHA: \`${{ steps.meta.outputs.sha }}\`"
            echo "- Environment tag: \`${{ steps.meta.outputs.env_tag }}\`"
            echo "- Digest ref: \`${{ steps.digest.outputs.repo_digest }}\`"
            echo "- Signed with: \`sigstore/cosign keyless (GitHub OIDC)\`"
            echo "- Provenance: \`enabled\`"
            echo "- SBOM: \`enabled\`"
            echo "- Run: ${{ steps.meta.outputs.run_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
